<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna — Sistema Gestor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bordo:#6B1E2E; --bordo-dark:#4A1220; --bordo-light:#8B3345;
    --creme:#F5EFE4; --creme-dark:#EDE4D4; --marrom:#A0785A;
    --marrom-light:#C4A882; --marrom-dark:#7A5840;
    --text:#2C1810; --text-light:#6B4F3A; --white:#FDFAF6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden;max-width:100vw}
  body{font-family:'Jost',sans-serif;background:var(--creme);color:var(--text);min-height:100vh}
  a{color:inherit}

  #carregandoOverlay{position:fixed;inset:0;z-index:99999;background:linear-gradient(145deg,#4A1220 0%,#2C0A14 60%,#1A0008 100%);display:flex;align-items:center;justify-content:center;color:#C4A882;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:20px}

  #appRoot{display:none}
  header{background:var(--bordo);color:var(--creme);padding:14px 26px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:0 2px 14px rgba(74,18,32,.25);position:sticky;top:0;z-index:200}
  .brand{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.4rem}
  .brand-sub{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--marrom-light);margin-top:-2px}
  header .spacer{flex:1}
  .hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:var(--creme);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:.78rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
  .hbtn:hover{background:rgba(255,255,255,.22)}
  #menuToggle{display:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:var(--creme);width:38px;height:38px;border-radius:6px;cursor:pointer;font-size:1.1rem;align-items:center;justify-content:center}

  .app-layout{display:flex;align-items:flex-start;min-height:calc(100vh - 66px)}

  nav.tabs{display:flex;flex-direction:column;gap:2px;background:var(--white);border-right:1px solid var(--creme-dark);padding:16px 12px;width:230px;flex:0 0 230px;position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto}
  .tab{padding:11px 14px;font-size:.82rem;font-weight:500;color:var(--text-light);cursor:pointer;border-radius:8px;border-left:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:10px}
  .tab:hover{background:var(--creme)}
  .tab.active{color:var(--bordo);background:var(--creme);border-left-color:var(--bordo);font-weight:600}
  .tab-secao{font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;color:var(--marrom-light);padding:14px 14px 4px}

  #sidebarOverlay{display:none;position:fixed;inset:0;background:rgba(44,24,16,.5);z-index:149}
  #sidebarOverlay.show{display:block}

  main{flex:1;min-width:0;max-width:1140px;margin:0 auto;padding:28px 26px 60px}
  .card{background:var(--white);border:1px solid var(--creme-dark);border-radius:12px;padding:22px;margin-bottom:18px}
  .card h2{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--bordo-dark);margin-bottom:14px}
  .card p.hint{font-size:.82rem;color:var(--text-light);margin-bottom:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);font-weight:500}
  .inp,select.inp,textarea.inp{padding:9px 12px;border:1.5px solid var(--creme-dark);border-radius:7px;font-family:'Jost',sans-serif;font-size:.85rem;color:var(--text);background:var(--white)}
  .inp:focus{outline:none;border-color:var(--marrom)}
  .btn{background:var(--bordo);color:var(--creme);border:none;padding:10px 18px;border-radius:7px;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--bordo-dark)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-outline{background:none;border:1.5px solid var(--bordo);color:var(--bordo)}
  .btn-outline:hover{background:var(--bordo);color:var(--creme)}
  .btn-danger{background:none;border:none;color:#B43C3C;cursor:pointer;font-size:.85rem}
  .btn-sm{padding:6px 12px;font-size:.72rem}

  .table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;min-width:560px;border-collapse:collapse;font-size:.82rem}
  th{text-align:left;padding:9px 10px;background:var(--creme);color:var(--text-light);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
  td{padding:9px 10px;border-top:1px solid var(--creme-dark);vertical-align:top}
  tr.inativo td{color:var(--text-light);opacity:.6}
  tr.alerta td{background:#FDF3E3}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:600;white-space:nowrap}
  .badge-ok{background:#E8F8F0;color:#27AE60}
  .badge-alerta{background:#FDF3E3;color:#B8791A}
  .badge-erro{background:#FDEDEC;color:#B43C3C}

  .empty{text-align:center;padding:40px;color:var(--text-light);font-size:.85rem}
  .loading{text-align:center;padding:30px;color:var(--text-light)}

  .item-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;flex-wrap:wrap}
  .item-row .field{flex:1;min-width:180px}
  .item-row .peso{max-width:120px}

  .stat-box{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px}
  .stat{background:var(--creme);border-radius:10px;padding:18px 22px;min-width:170px}
  .stat .num{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--bordo-dark);font-weight:600;line-height:1}
  .stat .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-light);margin-top:6px}

  .sabor-card{background:var(--white);border:1px solid var(--creme-dark);border-radius:12px;padding:16px 18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .sabor-card .fnome{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--bordo-dark);font-weight:600}
  .sabor-card .fdet{font-size:.76rem;color:var(--text-light);margin-top:2px}
  .sabor-card .facoes{display:flex;gap:8px;flex-wrap:wrap}

  .preview-box{background:var(--creme);border-radius:10px;padding:14px 16px;margin-top:12px}
  .preview-box h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--marrom-dark);margin-bottom:8px}
  .preview-line{display:flex;justify-content:space-between;font-size:.85rem;padding:4px 0;border-top:1px solid var(--creme-dark)}
  .preview-line:first-child{border-top:none}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(44,24,16,.5);z-index:500;align-items:center;justify-content:center;padding:20px}
  .modal-overlay.show{display:flex}
  .modal{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--white);border-radius:14px;padding:26px}
  .modal h3{font-family:'Cormorant Garamond',serif;font-size:1.25rem;color:var(--bordo-dark);margin-bottom:14px}
  .modal-actions{display:flex;gap:10px;margin-top:16px}
  .modal-close{background:none;border:none;color:var(--marrom-dark);text-decoration:underline;cursor:pointer;font-size:.78rem;display:block;margin:14px auto 0}
  .msg{font-size:.78rem;margin-top:8px;display:none}
  .msg.show{display:block}
  .msg.err{color:#B43C3C}
  .msg.ok{color:#27AE60}

  @media (max-width:860px){
    #menuToggle{display:flex}
    nav.tabs{position:fixed;top:0;left:0;height:100vh;z-index:150;transform:translateX(-100%);transition:transform .2s ease;box-shadow:2px 0 18px rgba(44,24,16,.25);padding-top:70px}
    nav.tabs.show{transform:translateX(0)}
  }

  @media (max-width:600px){
    header{padding:12px 16px}
    main{padding:20px 16px 50px}
    .card{padding:16px}
  }
</style>
</head>
<body>

<div id="carregandoOverlay">Carregando…</div>

<div id="appRoot">
<header>
  <button id="menuToggle" onclick="toggleSidebar()" aria-label="Abrir menu">☰</button>
  <div>
    <div class="brand">LUNA <span style="font-size:.7em;font-weight:400">Gestor</span></div>
    <div class="brand-sub">Vitrines & Produção</div>
  </div>
  <div class="spacer"></div>
  <a href="https://thiagodlborges.github.io/Sistema-Luna/" class="hbtn">← Sistema Luna</a>
  <button class="hbtn" onclick="sairApp()">Sair</button>
</header>

<div id="sidebarOverlay" onclick="toggleSidebar(false)"></div>

<div class="app-layout">
<nav class="tabs" id="sidebarNav">
  <div class="tab active" id="tabProducao" data-tab="producao" onclick="mudarTab('producao')">📋 Lançar Produção</div>
  <div class="tab" id="tabPainel" data-tab="painel" onclick="mudarTab('painel')">📊 Painel de Gestão</div>
  <div class="tab-secao" id="secaoCadastros">Cadastros</div>
  <div class="tab" id="tabFichas" data-tab="fichas" onclick="mudarTab('fichas')">📖 Fichas Técnicas</div>
</nav>

<main id="mainContent"><div class="loading">Carregando…</div></main>
</div>
</div>

<!-- Modal: Ficha Técnica -->
<div class="modal-overlay" id="modalFicha">
  <div class="modal">
    <h3 id="mfTitulo">Ficha Técnica</h3>
    <input type="hidden" id="mfSaborId">
    <input type="hidden" id="mfFichaId">
    <p class="hint" id="mfSaborNome" style="margin-bottom:14px"></p>
    <div class="field" style="max-width:200px;margin-bottom:14px"><label>Para fazer (Kg)</label><input class="inp" type="number" min="0.01" step="0.01" id="mfParaFazerKg" placeholder="Ex: 4.0"></div>
    <p class="hint" style="margin-bottom:8px">Variegatos usados nesse lote de referência, vindos direto do cadastro do Estoque CD.</p>
    <div id="mfItensLista"></div>
    <button class="btn-outline btn btn-sm" onclick="mfAdicionarItem()">+ Adicionar variegato</button>
    <div class="modal-actions">
      <button class="btn" onclick="salvarFicha()">Salvar ficha</button>
      <button class="btn-outline btn" onclick="fecharModal('modalFicha')">Cancelar</button>
    </div>
    <div class="msg" id="mfMsg"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://pbuhwpcpdcnaheaywmdv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBidWh3cGNwZGNuYWhlYXl3bWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyNjU5MzksImV4cCI6MjA5MTg0MTkzOX0.Mg4PVg96ZiV3C2Rn0GLQU9c7ui_41OlU6Ldqn5jcvyY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PORTAL_URL = 'https://thiagodlborges.github.io/Sistema-Luna/';

const $ = id => document.getElementById(id);
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtData(d){ return d ? new Date(d+'T12:00').toLocaleDateString('pt-BR') : '—'; }
function fmtDataHora(ts){ return ts ? new Date(ts).toLocaleString('pt-BR') : '—'; }
function fmtKg(v){ return (Number(v)||0).toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:3 })+' Kg'; }
function showMsg(id, texto, tipo){ const el = $(id); el.textContent = texto; el.className = 'msg show '+tipo; }
function fecharModal(id){ $(id).classList.remove('show'); }
function isoHoje(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// Lista fixa de lojas (mesmo padrão usado no módulo Qualidade) — não dá pra ler isso
// de `perfis` porque a RLS da tabela só permite cada usuário ver a própria linha.
const TODAS_LOJAS = ['Esplanada','Cianê','Tucuruvi','Indaiatuba','Jundiaí','Praça da Moça - Diadema','Buriti Mogi Guaçu','SP Market','Iguatemi Campinas','Shopping Itaquera','Atrium'];

let meuPerfil = null, souMaster = false, souGestorBackoffice = false;
let currentTab = 'producao';
let lojasCache = [];
let saboresCache = [];    // vem da Precificação Fábrica via RPC
let variegatosCache = []; // vem do Estoque CD via RPC
let fichasCache = {};     // sabor_produto_id -> { id, para_fazer_kg, itens: [...] }

// ===================== BOOT / AUTH =====================

async function verificarAcessoEIniciar(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = PORTAL_URL; return; }

  const { data: ok, error } = await sb.rpc('tem_acesso', { p_slug: 'gestor' });
  if (error || !ok) { await sb.auth.signOut(); window.location.href = PORTAL_URL; return; }

  const { data: perfil } = await sb.from('perfis').select('*').eq('id', session.user.id).single();
  if (!perfil) { window.location.href = PORTAL_URL; return; }
  meuPerfil = perfil;

  souMaster = perfil.tipo === 'master';
  souGestorBackoffice = souMaster || perfil.gestor_backoffice === true;

  if (!souGestorBackoffice){
    $('secaoCadastros').style.display = 'none';
    $('tabFichas').style.display = 'none';
  }

  $('carregandoOverlay').style.display = 'none';
  $('appRoot').style.display = 'block';
  lojasCache = TODAS_LOJAS.slice().sort((a,b) => a.localeCompare(b,'pt-BR'));
  await mudarTab('producao');
}

async function sairApp(){
  await sb.auth.signOut();
  window.location.href = PORTAL_URL;
}

function toggleSidebar(force){
  const nav = $('sidebarNav'), overlay = $('sidebarOverlay');
  const show = force !== undefined ? force : !nav.classList.contains('show');
  nav.classList.toggle('show', show);
  overlay.classList.toggle('show', show);
}

async function mudarTab(tab){
  currentTab = tab;
  toggleSidebar(false);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  if (tab === 'producao') await renderProducao();
  else if (tab === 'painel') await renderPainel();
  else if (tab === 'fichas') await renderFichas();
}

async function carregarSabores(force){
  if (saboresCache.length && !force) return saboresCache;
  const { data, error } = await sb.rpc('gestor_listar_sabores');
  saboresCache = error ? [] : (data || []);
  return saboresCache;
}

async function carregarVariegatos(force){
  if (variegatosCache.length && !force) return variegatosCache;
  const { data, error } = await sb.rpc('gestor_listar_variegatos');
  variegatosCache = error ? [] : (data || []);
  return variegatosCache;
}

async function carregarFichas(force){
  if (Object.keys(fichasCache).length && !force) return fichasCache;
  const [{ data: fichas }, { data: itens }] = await Promise.all([
    sb.from('gestor_fichas_tecnicas').select('*'),
    sb.from('gestor_ficha_itens').select('*').order('ordem')
  ]);
  fichasCache = {};
  (fichas||[]).forEach(f => { fichasCache[f.sabor_produto_id] = Object.assign({}, f, { itens: [] }); });
  (itens||[]).forEach(it => {
    const ficha = Object.values(fichasCache).find(f => f.id === it.ficha_id);
    if (ficha) ficha.itens.push(it);
  });
  return fichasCache;
}

// Selo de loja: usuário de loja fica travado na própria; backoffice/master escolhe.
function campoLojaHTML(idSelect, valorAtual, onChangeFn){
  if (!souGestorBackoffice && meuPerfil.loja){
    return '<input type="hidden" id="'+idSelect+'" value="'+esc(meuPerfil.loja)+'">'+
           '<div class="inp" style="background:var(--creme);cursor:default">'+esc(meuPerfil.loja)+'</div>';
  }
  return '<select class="inp" id="'+idSelect+'" onchange="'+onChangeFn+'">'+
    '<option value="">— selecione —</option>'+
    lojasCache.map(l => '<option value="'+esc(l)+'"'+(valorAtual===l?' selected':'')+'>'+esc(l)+'</option>').join('')+
  '</select>';
}

// ===================== LANÇAR PRODUÇÃO =====================
let gpLoja = null, gpData = null, gpProducoesDia = [];
let gpSaborSelecionado = null, gpKgAtual = null, gpPreview = null;

async function renderProducao(){
  if (!gpLoja && !souGestorBackoffice) gpLoja = meuPerfil.loja || null;
  if (!gpData) gpData = isoHoje();

  $('mainContent').innerHTML =
    '<div class="card">'+
      '<h2>Lançar Produção</h2>'+
      '<p class="hint">Escolha o sabor e informe o peso do gelato que acabou de produzir. O sistema calcula o consumo de variegato proporcional pela ficha técnica — confirme pra registrar.</p>'+
      '<div class="row">'+
        '<div class="field" style="min-width:220px"><label>Loja</label>'+campoLojaHTML('gpLojaSelect', gpLoja, 'mudarLojaProducao()')+'</div>'+
        '<div class="field" style="max-width:180px"><label>Data</label><input class="inp" type="date" id="gpDataInput" value="'+gpData+'" onchange="mudarDataProducao()"></div>'+
      '</div>'+
      '<div id="gpNovaProducao"></div>'+
    '</div>'+
    '<div class="card"><h2>Produções de hoje nessa loja</h2><div id="gpListaDia" class="loading">Carregando…</div></div>';

  await carregarSabores();
  await carregarFichas();
  renderNovaProducaoForm();
  if (gpLoja) await carregarProducoesDia(); else { $('gpListaDia').innerHTML = '<div class="empty">Escolha a loja.</div>'; }
}

function mudarLojaProducao(){
  gpLoja = $('gpLojaSelect').value || null;
  limparPreview();
  carregarProducoesDia();
}
function mudarDataProducao(){
  gpData = $('gpDataInput').value;
  limparPreview();
  carregarProducoesDia();
}

function renderNovaProducaoForm(){
  const ativos = saboresCache;
  const el = $('gpNovaProducao');
  if (!ativos.length){ el.innerHTML = '<p class="hint">Nenhum sabor de gelato ativo encontrado na Precificação Fábrica.</p>'; return; }

  el.innerHTML =
    '<div class="row" style="margin-top:6px">'+
      '<div class="field" style="min-width:240px"><label>Sabor</label><select class="inp" id="gpSaborSelect" onchange="mudarSaborProducao()">'+
        '<option value="">— selecione o sabor —</option>'+
        ativos.map(s => '<option value="'+s.id+'"'+(gpSaborSelecionado===s.id?' selected':'')+'>'+esc(s.nome)+'</option>').join('')+
      '</select></div>'+
      '<div class="field" style="max-width:160px"><label>Peso do gelato (Kg)</label><input class="inp" type="number" min="0.001" step="0.001" id="gpKgInput" value="'+(gpKgAtual||'')+'" oninput="calcularPreview()"></div>'+
    '</div>'+
    '<div id="gpPreviewBox"></div>';

  calcularPreview();
}

function mudarSaborProducao(){
  gpSaborSelecionado = $('gpSaborSelect').value || null;
  calcularPreview();
}

function limparPreview(){
  gpSaborSelecionado = null; gpKgAtual = null; gpPreview = null;
  const sel = document.getElementById('gpSaborSelect'); if (sel) sel.value = '';
  const kg = document.getElementById('gpKgInput'); if (kg) kg.value = '';
  const box = document.getElementById('gpPreviewBox'); if (box) box.innerHTML = '';
}

function calcularPreview(){
  const box = $('gpPreviewBox');
  const kgInput = $('gpKgInput');
  gpKgAtual = kgInput ? kgInput.value : null;
  const kg = Number(gpKgAtual);

  if (!gpSaborSelecionado || !kg || kg <= 0){ box.innerHTML = ''; gpPreview = null; return; }

  const sabor = saboresCache.find(s => s.id === gpSaborSelecionado);
  const ficha = fichasCache[gpSaborSelecionado];

  if (!ficha || !ficha.itens.length){
    gpPreview = { semFicha: true };
    box.innerHTML = '<div class="preview-box"><div class="msg show err" style="margin:0">⚠️ "'+esc(sabor.nome)+'" ainda não tem ficha técnica cadastrada. A produção pode ser confirmada mesmo assim, mas nenhum consumo de variegato será registrado.</div></div>';
    return;
  }

  const proporcao = kg / Number(ficha.para_fazer_kg);
  const linhas = ficha.itens.map(it => ({ nome: it.variegato_nome_cache, kg: proporcao * Number(it.peso_kg) }));
  gpPreview = { semFicha: false, linhas };

  box.innerHTML = '<div class="preview-box"><h4>Consumo de variegato calculado</h4>'+
    linhas.map(l => '<div class="preview-line"><span>'+esc(l.nome)+'</span><span>'+fmtKg(l.kg)+'</span></div>').join('')+
    '</div>'+
    '<button class="btn" style="margin-top:12px" onclick="confirmarProducao()">✔ Confirmar produção</button>';

  if (gpPreview.semFicha){
    box.innerHTML += '<button class="btn" style="margin-top:12px" onclick="confirmarProducao()">✔ Confirmar produção mesmo assim</button>';
  }
}

async function confirmarProducao(){
  if (!gpLoja){ alert('Escolha a loja.'); return; }
  const kg = Number(gpKgAtual);
  if (!gpSaborSelecionado || !kg || kg <= 0){ alert('Escolha o sabor e informe um peso válido.'); return; }

  const { error } = await sb.rpc('gestor_confirmar_producao', {
    p_loja: gpLoja, p_data: gpData, p_sabor_produto_id: gpSaborSelecionado, p_kg_gelato: kg
  });
  if (error){ alert('Erro ao confirmar: '+error.message); return; }

  limparPreview();
  renderNovaProducaoForm();
  await carregarProducoesDia();
}

async function carregarProducoesDia(){
  const el = $('gpListaDia');
  if (!gpLoja){ el.innerHTML = '<div class="empty">Escolha a loja.</div>'; return; }
  el.innerHTML = '<div class="loading">Carregando…</div>';

  const { data, error } = await sb.from('gestor_producoes').select('*, gestor_producao_consumos(*)').eq('loja', gpLoja).eq('data_producao', gpData).order('criado_em', { ascending:false });
  if (error){ el.innerHTML = '<div class="empty">Erro: '+esc(error.message)+'</div>'; return; }
  gpProducoesDia = data || [];
  renderProducoesDiaLista();
}

function renderProducoesDiaLista(){
  const el = $('gpListaDia');
  if (!gpProducoesDia.length){ el.innerHTML = '<div class="empty">Nenhuma produção confirmada ainda hoje nessa loja.</div>'; return; }

  let totalKg = 0;
  gpProducoesDia.forEach(p => totalKg += Number(p.kg_gelato)||0);

  el.innerHTML =
    '<div class="stat-box"><div class="stat"><div class="num">'+totalKg.toFixed(2)+'</div><div class="lbl">Kg de gelato produzidos</div></div><div class="stat"><div class="num">'+gpProducoesDia.length+'</div><div class="lbl">Produções confirmadas</div></div></div>'+
    gpProducoesDia.map(p => {
      const consumos = p.gestor_producao_consumos || [];
      return '<div class="sabor-card">'+
        '<div>'+
          '<div class="fnome">'+esc(p.sabor_nome_cache)+' — '+fmtKg(p.kg_gelato)+'</div>'+
          '<div class="fdet">'+fmtDataHora(p.criado_em)+' · '+esc(p.registrado_por_nome||'—')+
            (consumos.length ? '<br>Consumiu: '+consumos.map(c => esc(c.variegato_nome_cache)+' ('+fmtKg(c.kg_consumido)+')').join(', ') : '<br><span style="color:#B8791A">sem ficha técnica no momento — nenhum variegato debitado</span>')+
          '</div>'+
        '</div>'+
        (souGestorBackoffice ? '<div class="facoes"><button class="btn-danger" onclick="excluirProducao(\''+p.id+'\')">🗑️</button></div>' : '')+
      '</div>';
    }).join('');
}

async function excluirProducao(id){
  if (!confirm('Excluir essa produção e o consumo associado a ela?')) return;
  const { error } = await sb.from('gestor_producoes').delete().eq('id', id);
  if (error){ alert('Erro ao excluir: '+error.message); return; }
  await carregarProducoesDia();
}

// ===================== PAINEL DE GESTÃO =====================
let pgLoja = 'todas', pgDe = null, pgAte = null, pgProducoes = [];

async function renderPainel(){
  if (!pgDe){ const d = new Date(); d.setDate(d.getDate()-6); pgDe = d.toISOString().slice(0,10); }
  if (!pgAte) pgAte = isoHoje();
  if (pgLoja === 'todas' && !souGestorBackoffice) pgLoja = meuPerfil.loja || 'todas';

  const opcoesLoja = souGestorBackoffice
    ? '<option value="todas"'+(pgLoja==='todas'?' selected':'')+'>Todas as lojas</option>'+lojasCache.map(l => '<option value="'+esc(l)+'"'+(pgLoja===l?' selected':'')+'>'+esc(l)+'</option>').join('')
    : '<option value="'+esc(meuPerfil.loja||'')+'" selected>'+esc(meuPerfil.loja||'—')+'</option>';

  $('mainContent').innerHTML =
    '<div class="card">'+
      '<h2>Painel de Gestão</h2>'+
      '<p class="hint">Todas as produções confirmadas e o consumo de variegato no período, por loja.</p>'+
      '<div class="row">'+
        '<div class="field" style="min-width:200px"><label>Loja</label><select class="inp" id="pgLojaSelect" onchange="mudarFiltroPainel()"'+(souGestorBackoffice?'':' disabled')+'>'+opcoesLoja+'</select></div>'+
        '<div class="field"><label>De</label><input class="inp" type="date" id="pgDeInput" value="'+pgDe+'" onchange="mudarFiltroPainel()"></div>'+
        '<div class="field"><label>Até</label><input class="inp" type="date" id="pgAteInput" value="'+pgAte+'" onchange="mudarFiltroPainel()"></div>'+
      '</div>'+
      '<div id="pgConteudo"><div class="loading">Carregando…</div></div>'+
    '</div>';

  await carregarPainel();
}

function mudarFiltroPainel(){
  pgLoja = $('pgLojaSelect').value;
  pgDe = $('pgDeInput').value;
  pgAte = $('pgAteInput').value;
  carregarPainel();
}

async function carregarPainel(){
  const el = $('pgConteudo');
  el.innerHTML = '<div class="loading">Carregando…</div>';

  let query = sb.from('gestor_producoes').select('*, gestor_producao_consumos(*)').gte('data_producao', pgDe).lte('data_producao', pgAte);
  if (pgLoja !== 'todas') query = query.eq('loja', pgLoja);
  const { data, error } = await query.order('data_producao', { ascending:false });
  if (error){ el.innerHTML = '<div class="empty">Erro: '+esc(error.message)+'</div>'; return; }
  pgProducoes = data || [];
  renderPainelConteudo();
}

function renderPainelConteudo(){
  const el = $('pgConteudo');
  if (!pgProducoes.length){ el.innerHTML = '<div class="empty">Nenhuma produção confirmada nesse período.</div>'; return; }

  let totalKgGelato = 0;
  const porSabor = {}, porVariegato = {}, porLoja = {};
  pgProducoes.forEach(p => {
    totalKgGelato += Number(p.kg_gelato)||0;
    porSabor[p.sabor_nome_cache] = (porSabor[p.sabor_nome_cache]||0) + Number(p.kg_gelato);
    porLoja[p.loja] = (porLoja[p.loja]||0) + Number(p.kg_gelato);
    (p.gestor_producao_consumos||[]).forEach(c => {
      porVariegato[c.variegato_nome_cache] = (porVariegato[c.variegato_nome_cache]||0) + Number(c.kg_consumido);
    });
  });

  const linhaSabor = Object.entries(porSabor).sort((a,b) => b[1]-a[1]);
  const linhaVariegato = Object.entries(porVariegato).sort((a,b) => b[1]-a[1]);
  const linhaLoja = Object.entries(porLoja).sort((a,b) => b[1]-a[1]);

  el.innerHTML =
    '<div class="stat-box">'+
      '<div class="stat"><div class="num">'+totalKgGelato.toFixed(1)+'</div><div class="lbl">Kg de gelato produzidos</div></div>'+
      '<div class="stat"><div class="num">'+pgProducoes.length+'</div><div class="lbl">Produções confirmadas</div></div>'+
      '<div class="stat"><div class="num">'+linhaVariegato.reduce((s,[,v]) => s+v, 0).toFixed(1)+'</div><div class="lbl">Kg de variegato consumidos</div></div>'+
    '</div>'+

    '<div class="table-wrap" style="margin-bottom:22px"><table><thead><tr><th>Sabor</th><th>Kg produzidos</th></tr></thead><tbody>'+
      linhaSabor.map(([n,v]) => '<tr><td>'+esc(n)+'</td><td>'+fmtKg(v)+'</td></tr>').join('')+
    '</tbody></table></div>'+

    '<div class="table-wrap" style="margin-bottom:22px"><table><thead><tr><th>Variegato</th><th>Kg consumidos</th></tr></thead><tbody>'+
      (linhaVariegato.length ? linhaVariegato.map(([n,v]) => '<tr><td>'+esc(n)+'</td><td>'+fmtKg(v)+'</td></tr>').join('') : '<tr><td colspan="2" style="color:var(--text-light)">Nenhum consumo registrado (produções sem ficha técnica no momento).</td></tr>')+
    '</tbody></table></div>'+

    (pgLoja === 'todas' ? '<div class="table-wrap" style="margin-bottom:22px"><table><thead><tr><th>Loja</th><th>Kg produzidos</th></tr></thead><tbody>'+
      linhaLoja.map(([n,v]) => '<tr><td>'+esc(n)+'</td><td>'+fmtKg(v)+'</td></tr>').join('')+
    '</tbody></table></div>' : '')+

    '<h4 style="font-size:.9rem;color:var(--marrom-dark);margin-bottom:8px">Produções individuais</h4>'+
    '<div class="table-wrap"><table><thead><tr><th>Data</th><th>Loja</th><th>Sabor</th><th>Kg</th><th>Consumo</th></tr></thead><tbody>'+
      pgProducoes.map(p => {
        const consumos = p.gestor_producao_consumos || [];
        return '<tr><td>'+fmtData(p.data_producao)+'</td><td>'+esc(p.loja)+'</td><td>'+esc(p.sabor_nome_cache)+'</td><td>'+fmtKg(p.kg_gelato)+'</td>'+
          '<td style="font-size:.76rem">'+(consumos.length ? consumos.map(c => esc(c.variegato_nome_cache)+': '+fmtKg(c.kg_consumido)).join('<br>') : '<span style="color:var(--text-light)">—</span>')+'</td></tr>';
      }).join('')+
    '</tbody></table></div>';
}

// ===================== FICHAS TÉCNICAS (CADASTRO) =====================

async function renderFichas(){
  $('mainContent').innerHTML =
    '<div class="card">'+
      '<h2 style="margin:0">Sabores & Fichas Técnicas</h2>'+
      '<p class="hint" style="margin-top:6px">Sabores vêm direto da Precificação Fábrica. Cada ficha define quanto rende o lote de referência ("Para fazer: X Kg") e quanto entra de cada variegato — cadastrado direto do Estoque CD.</p>'+
      '<div id="fichasLista" style="margin-top:12px" class="loading">Carregando…</div>'+
    '</div>';

  await carregarSabores(true);
  await carregarVariegatos(true);
  await carregarFichas(true);
  renderFichasLista();
}

function renderFichasLista(){
  const el = $('fichasLista');
  if (!saboresCache.length){ el.innerHTML = '<div class="empty">Nenhum sabor de gelato ativo encontrado na Precificação Fábrica.</div>'; return; }

  el.innerHTML = saboresCache.map(s => {
    const ficha = fichasCache[s.id];
    const temFicha = ficha && ficha.itens.length;
    return '<div class="sabor-card">'+
      '<div>'+
        '<div class="fnome">'+esc(s.nome)+'</div>'+
        '<div class="fdet">'+(temFicha ? 'Para fazer '+fmtKg(ficha.para_fazer_kg)+' · '+ficha.itens.length+' variegato(s) na receita' : '⚠️ Sem ficha técnica cadastrada')+'</div>'+
      '</div>'+
      '<div class="facoes">'+
        '<button class="btn-outline btn btn-sm" onclick="abrirModalFicha(\''+s.id+'\')">'+(temFicha?'📖 Editar ficha':'📖 Criar ficha')+'</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

// ── Modal de ficha técnica ──────────────────────────
let mfItensAtual = [];

async function abrirModalFicha(saborId){
  $('mfMsg').className = 'msg';
  const sabor = saboresCache.find(s => s.id === saborId);
  const ficha = fichasCache[saborId];

  $('mfSaborId').value = saborId;
  $('mfFichaId').value = ficha ? ficha.id : '';
  $('mfTitulo').textContent = 'Ficha Técnica';
  $('mfSaborNome').textContent = sabor ? sabor.nome : '';
  $('mfParaFazerKg').value = ficha ? ficha.para_fazer_kg : '';
  mfItensAtual = ficha ? ficha.itens.map(it => Object.assign({}, it)) : [];

  mfRenderItens();
  $('modalFicha').classList.add('show');
}

function mfAdicionarItem(){
  mfItensAtual.push({ variegato_produto_id:'', variegato_nome_cache:'', peso_kg:'' });
  mfRenderItens();
}
function mfRemoverItem(idx){
  mfItensAtual.splice(idx,1);
  mfRenderItens();
}
function mfMudarVariegato(idx, id){
  const v = variegatosCache.find(x => String(x.id) === String(id));
  mfItensAtual[idx].variegato_produto_id = id ? Number(id) : '';
  mfItensAtual[idx].variegato_nome_cache = v ? v.nome : '';
}
function mfMudarPeso(idx, valor){
  mfItensAtual[idx].peso_kg = valor;
}

function mfRenderItens(){
  const el = $('mfItensLista');
  if (!variegatosCache.length){ el.innerHTML = '<p class="hint" style="color:#B43C3C">Nenhum variegato encontrado no cadastro do Estoque CD.</p>'; return; }
  if (!mfItensAtual.length){ el.innerHTML = '<p class="hint">Nenhum item ainda.</p>'; return; }
  el.innerHTML = mfItensAtual.map((it, i) => (
    '<div class="item-row">'+
      '<div class="field"><label>Variegato</label><select class="inp" onchange="mfMudarVariegato('+i+',this.value)">'+
        '<option value="">— selecione —</option>'+
        variegatosCache.map(v => '<option value="'+v.id+'"'+(String(it.variegato_produto_id)===String(v.id)?' selected':'')+'>'+esc(v.nome)+'</option>').join('')+
      '</select></div>'+
      '<div class="field peso"><label>Peso líq. (Kg)</label><input class="inp" type="number" min="0.001" step="0.001" value="'+it.peso_kg+'" onchange="mfMudarPeso('+i+',this.value)"></div>'+
      '<button class="btn-danger" onclick="mfRemoverItem('+i+')">🗑️</button>'+
    '</div>'
  )).join('');
}

async function salvarFicha(){
  const saborId = $('mfSaborId').value;
  const fichaId = $('mfFichaId').value || null;
  const paraFazerKg = Number($('mfParaFazerKg').value);
  const sabor = saboresCache.find(s => s.id === saborId);

  if (!paraFazerKg || paraFazerKg <= 0){ showMsg('mfMsg','Informe quantos Kg esse lote de referência rende.','err'); return; }
  if (!mfItensAtual.length){ showMsg('mfMsg','Adicione ao menos um variegato na receita.','err'); return; }
  for (const it of mfItensAtual){
    if (!it.variegato_produto_id){ showMsg('mfMsg','Selecione o variegato em todos os itens.','err'); return; }
    if (!it.peso_kg || Number(it.peso_kg) <= 0){ showMsg('mfMsg','Preencha um peso válido em todos os itens.','err'); return; }
  }

  const usuario = (await sb.auth.getUser()).data.user;
  let id = fichaId;
  if (id){
    const { error } = await sb.from('gestor_fichas_tecnicas').update({ para_fazer_kg: paraFazerKg, sabor_nome_cache: sabor.nome }).eq('id', id);
    if (error){ showMsg('mfMsg','Erro: '+error.message,'err'); return; }
    await sb.from('gestor_ficha_itens').delete().eq('ficha_id', id);
  } else {
    const { data, error } = await sb.from('gestor_fichas_tecnicas').insert({
      sabor_produto_id: saborId, sabor_nome_cache: sabor.nome, para_fazer_kg: paraFazerKg,
      criado_por: usuario.id, criado_por_nome: meuPerfil.nome
    }).select('id').single();
    if (error){ showMsg('mfMsg','Erro: '+error.message,'err'); return; }
    id = data.id;
  }

  const linhas = mfItensAtual.map((it, i) => ({
    ficha_id: id, variegato_produto_id: Number(it.variegato_produto_id),
    variegato_nome_cache: it.variegato_nome_cache, peso_kg: Number(it.peso_kg), ordem: i+1
  }));
  const { error: errItens } = await sb.from('gestor_ficha_itens').insert(linhas);
  if (errItens){ showMsg('mfMsg','Ficha salva, mas houve erro ao gravar os itens: '+errItens.message,'err'); return; }

  fecharModal('modalFicha');
  await carregarFichas(true);
  renderFichasLista();
}

verificarAcessoEIniciar();
</script>
